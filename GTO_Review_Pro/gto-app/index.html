<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTO Review Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <span class="logo-icon">♠️</span> GTO Review <span class="badge">Pro</span>
        </div>
        <nav class="main-nav">
            <button class="nav-btn active">Preflop Ranges</button>
            <button class="nav-btn">Hand Replayer</button>
            <button class="nav-btn">Analysis</button>
        </nav>
        <div class="user-profile">
            <div class="avatar">U</div>
        </div>
    </header>

    <main class="app-container">
        <!-- Left Panel: Settings & Table -->
        <section class="left-panel">
            <div class="panel-header">
                <h2>Situation Setup</h2>
            </div>
            
            <div class="control-group">
                <label>Game Type</label>
                <select class="premium-select" id="game-type">
                    <option value="6MAX">6-Max Cash Game</option>
                    <option value="9MAX">9-Max Full Ring</option>
                </select>
            </div>

            <div class="control-group">
                <label>Hero Position</label>
                <div class="position-selector" id="position-selector">
                    <button class="pos-btn" data-pos="UTG">UTG</button>
                    <button class="pos-btn" data-pos="UTG1" style="display:none;">UTG+1</button>
                    <button class="pos-btn" data-pos="UTG2" style="display:none;">UTG+2</button>
                    <button class="pos-btn" data-pos="LJ" style="display:none;">LJ</button>
                    <button class="pos-btn" data-pos="HJ">HJ</button>
                    <button class="pos-btn" data-pos="CO">CO</button>
                    <button class="pos-btn active" data-pos="BTN">BTN</button>
                    <button class="pos-btn" data-pos="SB">SB</button>
                    <button class="pos-btn" data-pos="BB">BB</button>
                </div>
            </div>

            <div class="control-group">
                <label>Action Before Hero</label>
                <select class="premium-select" id="action-before">
                    <option value="RFI">RFI (Raise First In)</option>
                    <option value="VS_OPEN">vs Open</option>
                    <option value="VS_3BET">vs 3-Bet</option>
                </select>
            </div>

            <!-- Mini Poker Table Graphic -->
            <div class="poker-table-container">
                <div class="poker-table">
                    <div class="table-felt">
                        <div class="table-logo">♠️ GTO</div>
                        <div class="community-cards placeholder">
                            <span>Flop</span>
                        </div>
                    </div>
                    <!-- Seats -->
                    <div class="seat utg" data-pos="UTG">UTG</div>
                    <div class="seat utg1" data-pos="UTG1" style="display:none;">U1</div>
                    <div class="seat utg2" data-pos="UTG2" style="display:none;">U2</div>
                    <div class="seat lj" data-pos="LJ" style="display:none;">LJ</div>
                    <div class="seat hj" data-pos="HJ">HJ</div>
                    <div class="seat co" data-pos="CO">CO</div>
                    <div class="seat btn active" data-pos="BTN">BTN</div>
                    <div class="seat sb" data-pos="SB">SB</div>
                    <div class="seat bb" data-pos="BB">BB</div>
                </div>
            </div>
        </section>

        <!-- Right Panel: Range Matrix & Details -->
        <section class="right-panel">
            <div class="matrix-header">
                <div>
                    <h2 id="current-range-title">BTN RFI Range</h2>
                    <p class="subtitle">100BB Effective, 2.5bb Open Size</p>
                </div>
                <div class="range-stats">
                    <div class="stat-box">
                        <span class="stat-label">Frequency</span>
                        <span class="stat-value" id="raise-freq">43.2%</span>
                    </div>
                </div>
            </div>

            <div class="matrix-container">
                <div class="range-matrix" id="range-matrix">
                    <!-- Matrix cells will be generated by JS -->
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="color-box color-raise"></div>
                        <span>Raise (100%)</span>
                    </div>
                    <div class="legend-item">
                        <div class="color-box color-mixed"></div>
                        <span>Mixed (50%)</span>
                    </div>
                    <div class="legend-item">
                        <div class="color-box color-fold"></div>
                        <span>Fold (0%)</span>
                    </div>
                </div>
            </div>

            <!-- Hover Details Panel -->
            <div class="hover-details" id="hover-details">
                <div class="hover-hand">Select a hand</div>
                <div class="hover-actions">
                    <div class="action-bar-container">
                        <div class="action-bar-label">Raise</div>
                        <div class="action-bar-bg">
                            <div class="action-bar-fill fill-raise" style="width: 0%" id="hover-raise-fill"></div>
                        </div>
                        <div class="action-bar-pct" id="hover-raise-pct">0%</div>
                    </div>
                    <div class="action-bar-container">
                        <div class="action-bar-label">Fold</div>
                        <div class="action-bar-bg">
                            <div class="action-bar-fill fill-fold" style="width: 100%" id="hover-fold-fill"></div>
                        </div>
                        <div class="action-bar-pct" id="hover-fold-pct">100%</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="data/preflop_ranges.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
